name: Threads Auto Post

on:
  schedule:
    - cron: '0 6 * * *'   # 08:00 Spain (UTC+2)
    - cron: '0 7 * * *'   # 09:00 Spain
    - cron: '0 8 * * *'   # 10:00 Spain
    - cron: '0 9 * * *'   # 11:00 Spain
    - cron: '0 10 * * *'  # 12:00 Spain
    - cron: '0 11 * * *'  # 13:00 Spain
    - cron: '0 12 * * *'  # 14:00 Spain
    - cron: '0 13 * * *'  # 15:00 Spain
    - cron: '0 14 * * *'  # 16:00 Spain
    - cron: '0 15 * * *'  # 17:00 Spain
    - cron: '0 16 * * *'  # 18:00 Spain
    - cron: '0 17 * * *'  # 19:00 Spain
    - cron: '0 18 * * *'  # 20:00 Spain
    - cron: '0 19 * * *'  # 21:00 Spain
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 threads_poster.py --post

      - name: Save state
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add posts_analytics.json knowledge_base.json
          git diff --staged --quiet || git commit -m "Update post state [skip ci]"
          git push
