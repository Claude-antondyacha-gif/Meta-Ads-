name: Threads Auto Reply

on:
  schedule:
    - cron: '0 */2 * * *'  # кожні 2 години
  workflow_dispatch:

jobs:
  reply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reply to comments
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 threads_poster.py --reply

      - name: Save replied state
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add replied_comments.json
          git diff --staged --quiet || git commit -m "Update replied comments [skip ci]"
          git push
