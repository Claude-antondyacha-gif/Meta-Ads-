name: Threads Analytics

on:
  schedule:
    - cron: '0 21 * * *'  # 23:00 Spain (UTC+2)
  workflow_dispatch:

jobs:
  analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect post analytics
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 threads_poster.py --analytics

      - name: Save analytics data
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add posts_analytics.json knowledge_base.json
          git diff --staged --quiet || git commit -m "Update analytics & knowledge base [skip ci]"
          git push
